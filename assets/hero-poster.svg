<text x="60" y="50" font-family="Lato,Arial" font-size="27" font-weight="700" fill="#fff" >FrSky ETHOS: what the radio OS does, which</text><text x="60" y="84" font-family="Lato,Arial" font-size="27" font-weight="700" fill="#fff" >transmitters run it and how to keep it current</text>
<rect x="60.5" y="134.5" width="610" height="122" rx="16" fill="#fff" fill-opacity=".04" stroke="#8fc320" stroke-opacity=".65"/>
<text x="92" y="164" font-family="Lato,Arial" font-size="16.5" font-weight="400" fill="#e9eef0" >FrSky ETHOS is the operating system on FrSky's TANDEM, TWIN and</text><text x="92" y="188" font-family="Lato,Arial" font-size="16.5" font-weight="400" fill="#e9eef0" >ISRM Horus transmitters. This manual explains what it does, where the</text><text x="92" y="212" font-family="Lato,Arial" font-size="16.5" font-weight="400" fill="#e9eef0" >desktop Suite fits in, and how to update and back up a radio using</text><text x="92" y="236" font-family="Lato,Arial" font-size="16.5" font-weight="400" fill="#e9eef0" >FrSky's own guides.</text>
<rect x="60" y="274" width="46" height="46" rx="9" fill="#8fc320" fill-opacity=".08" stroke="#8fc320" stroke-opacity=".7"/><circle cx="83" cy="297" r="8" fill="none" stroke="#8fc320" stroke-width="2"/><text x="118" y="294" font-family="Lato,Arial" font-size="15" font-weight="700" fill="#8fc320" >Radios</text><text x="118" y="312" font-family="Lato,Arial" font-size="12.5" font-weight="400" fill="#aab3b6" >TANDEM, TWIN, Horus X10 and X12 ISRM</text><rect x="377" y="274" width="46" height="46" rx="9" fill="#8fc320" fill-opacity=".08" stroke="#8fc320" stroke-opacity=".7"/><circle cx="400" cy="297" r="8" fill="none" stroke="#8fc320" stroke-width="2"/><text x="435" y="294" font-family="Lato,Arial" font-size="15" font-weight="700" fill="#8fc320" >Channels</text><text x="435" y="312" font-family="Lato,Arial" font-size="12.5" font-weight="400" fill="#aab3b6" >24 per module, two modules at once</text><rect x="60" y="332" width="46" height="46" rx="9" fill="#8fc320" fill-opacity=".08" stroke="#8fc320" stroke-opacity=".7"/><circle cx="83" cy="355" r="8" fill="none" stroke="#8fc320" stroke-width="2"/><text x="118" y="352" font-family="Lato,Arial" font-size="15" font-weight="700" fill="#8fc320" >Desktop app</text><text x="118" y="370" font-family="Lato,Arial" font-size="12.5" font-weight="400" fill="#aab3b6" >FrSky Suite 2.0.2, Windows and macOS</text><rect x="377" y="332" width="46" height="46" rx="9" fill="#8fc320" fill-opacity=".08" stroke="#8fc320" stroke-opacity=".7"/><circle cx="400" cy="355" r="8" fill="none" stroke="#8fc320" stroke-width="2"/><text x="435" y="352" font-family="Lato,Arial" font-size="15" font-weight="700" fill="#8fc320" >Price</text><text x="435" y="370" font-family="Lato,Arial" font-size="12.5" font-weight="400" fill="#aab3b6" >None published</text>
<rect x="66" y="393" width="153" height="48" rx="24" fill="#8fc320"/><text x="142" y="424" font-family="Lato,Arial" font-size="18" font-weight="700" fill="#111" text-anchor="middle">Get ETHOS</text>
